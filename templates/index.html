<!DOCTYPE html>
<html>
<head>
    <title>Sau bot</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> <!-- Font Awesome for icons -->
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
</head>
<body>
    <div id="chatbotContainer" class="chatbot-container">
        <div class="card">
            <div class="card-header text-center">
                <h2>College Chatbot</h2>
                <button class="close-btn" onclick="toggleChatbot()">x</button>
            </div>
            <div class="card-body">
                <ul id="messages" class="list-unstyled">
                    {% for message in messages %}
                        {% if message[0] == 'bot' %}
                            <li class="message bot">{{ message[1] }}</li>
                        {% else %}
                            <li class="message user">{{ message[1] }}</li>
                        {% endif %}
                    {% endfor %}
                </ul>
            </div>
            <div class="card-footer">
                <div class="input-group">
                    <!-- Options button -->
                    <div class="input-group-prepend">
                        <button class="btn btn-sm btn-secondary" onclick="toggleOptions()">
                            <i class="fas fa-ellipsis-v"></i> <!-- Font Awesome icon for options -->
                        </button>
                    </div>
                    <!-- Message input -->
                    <input id="messageInput" type="text" class="form-control" placeholder="Type your message here..." autocomplete="off">
                    <!-- Send button -->
                    <div class="input-group-append">
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
                <!-- Options menu -->
                <div id="optionsMenu" class="options-menu">
                    <div class="message-container">
                        <div class="message bot">
                            <button class="btn btn-light" onclick="sendButtonMessage('Option 1')">Option 1</button>
                            <button class="btn btn-light" onclick="sendButtonMessage('Option 2')">Option 2</button>
                            <button class="btn btn-light" onclick="sendButtonMessage('Option 3')">Option 3</button>
                            <button class="btn btn-light" onclick="sendButtonMessage('Option 4')">Option 4</button>
                            <button class="btn btn-light" onclick="sendButtonMessage('Option 5')">Option 5</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <button id="chatIcon" class="chat-icon" onclick="toggleChatbot()">Chat</button>
    <script type="text/javascript" src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
